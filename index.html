<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>موقعي الشخصي - أحمد الشاعر</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.8em;
            color: #ffd700;
        }
        p {
            font-size: 1.2em;
            line-height: 1.4;
            margin: 20px 0;
        }
        a.contact-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ffd700;
            color: #222;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.6);
            transition: background-color 0.3s ease;
        }
        a.contact-button:hover {
            background-color: #e6c200;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>أهلاً بك في موقعي الشخصي</h1>
        <p>أنا أحمد الشاعر، مطور ويب ومصمم. أشاركك هنا مشاريعي وأعمالي.</p>
